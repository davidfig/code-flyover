[package]
name = "semantic-zoom-desktop"
version = "0.1.0"
description = "Semantic Zoom in its own window: starts the app's server from this checkout and shows it"
edition = "2021"
publish = false

[lib]
name = "semantic_zoom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
