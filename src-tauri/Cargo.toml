[package]
name = "code-flyover-desktop"
version = "0.1.5"
description = "Code Flyover in its own window: starts the app's server from this checkout and shows it"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "code_flyover_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-window-state = "2"

[features]
# Release builds with the update feed (.github/workflows/release.yml, tauri.updater.conf.json). Local builds leave it
# off, so a copy built from a checkout never replaces itself with a downloaded release.
updater = ["dep:tauri-plugin-updater"]
